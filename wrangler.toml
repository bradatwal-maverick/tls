name = "trade-licence-solutions"
main = "src/index.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first on every request, so it owns the URLs (no /home or /states/... showing)
run_worker_first = true

