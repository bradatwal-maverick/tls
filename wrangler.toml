name = "trade-licence-solutions"
main = "src/index.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first on every request, so it owns the URLs (no /home or /states/... showing)
run_worker_first = true

# Enquiry dashboard database (Cloudflare D1)
[[d1_databases]]
binding = "DB"
database_name = "tls-enquiries"
database_id = "deed2038-ec8b-4d3f-bd5d-5e31cb780434"
migrations_dir = "migrations"

[previews]
